<script type="module">
import loader from "../index.js";

function assert(c) {
  if (!c) throw Error("assertion failed");
}
(async () => {
  let module;

  module = await loader.instantiate(fetch("./build/default.wasm"));
  assert(module.memory);

  module = await loader.instantiate(await fetch("./build/default.wasm"));
  assert(module.memory);

  module = await loader.instantiate((await fetch("./build/default.wasm")).arrayBuffer());
  assert(module.memory);

  module = await loader.instantiate(await (await fetch("./build/default.wasm")).arrayBuffer());
  assert(module.memory);

  module = await loader.instantiateStreaming(fetch("./build/default.wasm"));
  assert(module.memory);

  module = await loader.instantiateStreaming(await fetch("./build/default.wasm"));
  assert(module.memory);

  let instantiateStreaming = WebAssembly.instantiateStreaming;
  delete WebAssembly.instantiateStreaming;

  module = await loader.instantiate(fetch("./build/default.wasm"));
  assert(module.memory);

  module = await loader.instantiate(await fetch("./build/default.wasm"));
  assert(module.memory);

  module = await loader.instantiateStreaming(fetch("./build/default.wasm"));
  assert(module.memory);

  module = await loader.instantiateStreaming(await fetch("./build/default.wasm"));
  assert(module.memory);

  WebAssembly.instantiateStreaming = instantiateStreaming;

  console.log("ok");
})();
</script>
